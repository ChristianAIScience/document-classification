# MLflow tracking server for evaluation runs: docker compose up -d mlflow → http://localhost:5000
# Runs and artifacts live in ./mlflow-data; clients upload artifacts over HTTP (--serve-artifacts).
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    container_name: docclass-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    restart: unless-stopped
