[project]
name = "docclass"
version = "0.1.0"
description = "KI-gestütztes Assistenzsystem zur Klassifizierung und Extraktion von Angeboten und Rechnungen"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "alembic>=1.16",
    "docling>=2.145.0",
    "fastapi>=0.162.0",
    "langchain-openai>=1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docclass = "docclass.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "ipykernel>=7.4.0",
    "pytest>=8",
    "ruff>=0.12",
]
eval = [
    "mlflow-skinny>=3",
    "pandas>=2",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not postgres"]
markers = ["postgres: integration tests against a real PostgreSQL (run with: pytest -m postgres)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]
